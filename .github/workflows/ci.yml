name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Both repositories are checked out side by side under the workspace, mirroring the local
      # layout (a wlRIX workspace root holding sibling repos). Wlrix.Desks reaches the fork by
      # the relative path ../../../NWayland, which only resolves with this arrangement -- hence
      # the explicit `path:` on this checkout rather than the default.
      - uses: actions/checkout@v4
        with:
          path: wlrix-apps

      # The NWayland fork supplies the protocol source generator, which carries codegen fixes the
      # published package does not. It is referenced as an analyzer with
      # ReferenceOutputAssembly="false", so it contributes no assembly: the NWayland runtime the
      # apps bind against is the pinned nuget package (see Directory.Packages.props).
      #
      # Submodules are not fetched wholesale: NWayland.Generator builds from Roslyn packages
      # alone, and most of the protocol XML under external/ is only needed by the fork's own
      # protocol projects. The exceptions are fetched in the next step.
      #
      # If wlRIX/NWayland is private, the default GITHUB_TOKEN cannot read it and a PAT with
      # repo scope has to be supplied here as `token: ${{ secrets.NWAYLAND_TOKEN }}`.
      - uses: actions/checkout@v4
        with:
          repository: wlRIX/NWayland
          ref: master
          path: NWayland

      # The protocol sets the apps generate bindings from: wlr-protocols for
      # wlr-output-management, and wlrix-protocols for wlRIX's own (wlrix-desks,
      # wlrix-output-color). Only these two are fetched; each is a few hundred kilobytes, where
      # the wayland and wayland-protocols submodules are whole projects.
      - name: Fetch protocols
        working-directory: NWayland
        run: git submodule update --init external/wlr-protocols external/wlrix-protocols

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: wlrix-apps
        run: dotnet restore
      - name: Build
        working-directory: wlrix-apps
        run: dotnet build --no-restore --configuration Release
      - name: Test
        working-directory: wlrix-apps
        run: dotnet test --no-build --configuration Release
